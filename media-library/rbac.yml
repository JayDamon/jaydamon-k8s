apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-library-storage-service-configmap-reader
  namespace: media-jd
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-library-storage-service-configmap-reader
  namespace: media-jd
subjects:
  - kind: ServiceAccount
    name: default
    namespace: media-jd
roleRef:
  kind: Role
  name: media-library-storage-service-configmap-reader
  apiGroup: rbac.authorization.k8s.io
